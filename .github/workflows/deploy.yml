name: Validate and deploy interview bank

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate questions
        run: node scripts/validate.mjs
      - name: Test all behavior
        run: node --test
      - name: Package site files only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, copyFileSync, writeFileSync } from 'node:fs';
          mkdirSync('_site/assets', { recursive: true });
          for (const path of ['index.html', 'questions.json', 'assets/app.js', 'assets/core.mjs', 'assets/style.css']) {
            copyFileSync(path, `_site/${path}`);
          }
          writeFileSync('_site/.nojekyll', '');
          NODE
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
